[helpers]

[default]
depends = []

[default.files]
"config/dotfiles" = "~/.config/dotfiles"
"config/atuin" = "~/.config/atuin"
"config/kitty" = "~/.config/kitty"
"config/mpv" = "~/.config/mpv"
"config/niri" = "~/.config/niri"
"config/nushell" = "~/.config/nushell"
"config/nvim" = "~/.config/nvim"
"config/uwsm" = "~/.config/uwsm"
"config/wireplumber" = "~/.config/wireplumber"
"config/xdg-desktop-portal" = "~/.config/xdg-desktop-portal"
"config/quickshell" = "~/.config/quickshell"
"config/systemd/user/quickshell.service" = "~/.config/systemd/user/quickshell.service"

# herdr — only the two config files; the rest of ~/.config/herdr is runtime state
# (session.json, plugins.json, logs, sockets, installed plugins). config/herdr/plugins.list
# and plugins.lock are deliberately NOT mapped: herdr-lazy is pointed at them in-place via
# HERDR_LAZY_LIST (config/uwsm/env), because it rewrites the lock with rename(2), which
# would replace a symlink with a regular file and silently detach it from this repo.
"config/herdr/config.toml" = "~/.config/herdr/config.toml"
# Explicitly a symlink: the file documents `open = "bookmarks open {{id}}"`, which dotter's
# automatic detection reads as a handlebars template and then fails to render.
"config/herdr/plugins/config/herdr-navigator/config.toml" = { target = "~/.config/herdr/plugins/config/herdr-navigator/config.toml", type = "symbolic" }
"config/herdr-automatic-rename/config.sh" = "~/.config/herdr-automatic-rename/config.sh"

"config/electron-flags.conf" = "~/.config/electron-flags.conf"
"config/logid.cfg" = { target = "/etc/logid.cfg", type = "symbolic", owner = "root" }
"config/keyd/default.conf" = { target = "/etc/keyd/default.conf", type = "symbolic", owner = "root" }
"config/mimeapps.list" = "~/.config/mimeapps.list"
"config/user-dirs.dirs" = "~/.config/user-dirs.dirs"

"applications" = "~/.local/share/applications/"
"autostart" = "~/.config/autostart"

# Skrypty operacyjne. Katalog docelowy trzyma też binarki spoza repo (pnpm,
# scrapling, codebase-memory-mcp), więc mapowanie jest na katalog z ukośnikiem —
# dotter linkuje wtedy pojedyncze pliki, a nie podmienia całego ~/.local/bin.
"bin" = "~/.local/bin/"

# Claude Code — only config sources (no secrets/runtime/plugins; those stay local).
# settings.local.json is intentionally NOT mapped: it is the per-host override layer.
".claude/settings.json" = "~/.claude/settings.json"
".claude/CLAUDE.md" = "~/.claude/CLAUDE.md"
".claude/.mcp.json" = "~/.claude/.mcp.json"
".claude/agents" = "~/.claude/agents"
".claude/skills" = "~/.claude/skills"
".claude/hooks" = "~/.claude/hooks"

[host-pc.files]
"hosts/pc/niri-output.kdl" = "~/.config/niri/output.kdl"
"hosts/pc/uwsm-gpu-env" = "~/.config/uwsm/env.d/gpu"
# Per-host: each machine's mirror config names the *other* machine.
"hosts/pc/herdr-mirror-hosts.toml" = "~/.config/herdr-mirror/hosts.toml"

[host-mac.files]
"hosts/mac/niri-output.kdl" = "~/.config/niri/output.kdl"
"hosts/mac/uwsm-gpu-env" = "~/.config/uwsm/env.d/gpu"

# To add another machine: duplicate a host block above as [host-<name>.files]
# and create hosts/<name>/ with the two files.

[default.variables]

[settings]
default_target_type = "automatic"
