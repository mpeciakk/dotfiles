<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Wyspa — ekran blokady</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C9BBF7}a:hover{color:#E2D9FF}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.pw{background:transparent;border:0;outline:none;color:#ECEAF2;font:inherit;font-size:15px;letter-spacing:0.12em}
.pw::placeholder{color:#A29DB3;letter-spacing:0}
.pwbox:focus-within{outline:1.5px solid rgba(185,167,245,0.8);outline-offset:3px}
@keyframes shakeA{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
@keyframes shakeB{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #2A2440; font-family: 'Geist', system-ui, sans-serif; color: #ECEAF2">

<div aria-hidden="true" style="position: absolute; inset: 0; filter: {{wpFilter}}; transform: {{wpScale}}; transition: filter 700ms cubic-bezier(0.32, 0.72, 0, 1), transform 700ms cubic-bezier(0.32, 0.72, 0, 1)">
<svg width="1440" height="900" viewBox="0 0 1440 900" style="position: absolute; inset: 0">
<rect x="0" y="0" width="1440" height="900" fill="#2A2440"></rect>
<circle cx="1060" cy="250" r="38" fill="#F1D6AE"></circle>
<path d="M0 560 C 180 500 360 540 520 500 C 700 455 860 520 1040 480 C 1220 440 1340 470 1440 450 V900 H0 Z" fill="#3B2F55"></path>
<path d="M0 650 C 220 600 420 640 640 600 C 860 560 1040 630 1240 590 C 1340 572 1400 580 1440 575 V900 H0 Z" fill="#4C3660"></path>
<path d="M0 740 C 260 700 520 740 780 710 C 1000 685 1240 730 1440 700 V900 H0 Z" fill="#5E3E64"></path>
<rect x="0" y="815" width="1440" height="85" fill="#6B4566"></rect>
</svg>
</div>

<div aria-hidden="true" style="position: absolute; inset: 0; opacity: {{deskOp}}; transform: {{deskTf}}; transition: opacity 420ms ease {{deskDelay}}ms, transform 520ms cubic-bezier(0.32, 0.72, 0, 1) {{deskDelay}}ms">
<div style="position: absolute; left: 16px; width: 760px; top: 44px; bottom: 16px; border-radius: 14px; background: rgba(18,16,28,0.88); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06); padding: 18px 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px"><span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #8B8699">helium</span><span style="width: 60%; height: 8px; border-radius: 4px; background: #2C2A39"></span><span style="width: 44%; height: 8px; border-radius: 4px; background: #2C2A39"></span></div>
<div style="position: absolute; left: 792px; width: 760px; top: 44px; bottom: 16px; border-radius: 14px; background: rgba(18,16,28,0.88); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06); padding: 18px 22px; box-sizing: border-box"><span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #8B8699">terminal</span></div>
</div>

<div aria-hidden="true" style="position: absolute; top: 0; left: 704px; width: 16px; height: 16px; background: rgba(16,14,26,0.62); backdrop-filter: blur(24px); -webkit-mask-image: radial-gradient(circle at 0 100%, transparent 15.5px, #000 16px); mask-image: radial-gradient(circle at 0 100%, transparent 15.5px, #000 16px); opacity: {{earOp}}; transition: opacity 200ms ease {{earDelay}}ms"></div>
<div aria-hidden="true" style="position: absolute; top: 0; left: 820px; width: 16px; height: 16px; background: rgba(16,14,26,0.62); backdrop-filter: blur(24px); -webkit-mask-image: radial-gradient(circle at 100% 100%, transparent 15.5px, #000 16px); mask-image: radial-gradient(circle at 100% 100%, transparent 15.5px, #000 16px); opacity: {{earOp}}; transition: opacity 200ms ease {{earDelay}}ms"></div>

<section aria-label="{{islandLabel}}" style="position: absolute; left: 50%; transform: translateX(-50%); top: {{top}}px; width: {{w}}px; height: {{h}}px; border-radius: {{rad}}; overflow: hidden; background: rgba(16,14,26,0.6); backdrop-filter: blur(30px) saturate(1.4); box-shadow: 0 24px 80px rgba(10,6,20,0.45), inset 0 0 0 1px rgba(255,255,255,0.08); transition: {{islandTr}}">

<div style="position: absolute; top: 0; left: 50%; width: 200px; height: 36px; display: flex; align-items: center; justify-content: center; gap: 14px; opacity: {{restOp}}; transform: translateX(-50%) scale({{restSc}}); transition: {{restTr}}; pointer-events: {{restPe}}">
<span style="display: flex; gap: 4px; align-items: center"><span style="width: 5px; height: 5px; border-radius: 3px; background: #57536A"></span><span style="width: 14px; height: 5px; border-radius: 3px; background: {{accent}}"></span><span style="width: 5px; height: 5px; border-radius: 3px; background: #57536A"></span></span>
<span style="font-family: 'Geist Mono', monospace; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums">18:49</span>
</div>

<div style="position: absolute; top: 0; left: 50%; width: 460px; height: 360px; box-sizing: border-box; padding: 30px 28px 24px; display: flex; flex-direction: column; align-items: center; opacity: {{lockOp}}; transform: translateX(-50%) scale({{lockSc}}); filter: {{lockBlur}}; transition: {{lockTr}}; pointer-events: {{lockPe}}">
<span style="font-size: 88px; font-weight: 500; letter-spacing: -0.045em; line-height: 1; font-variant-numeric: tabular-nums">18:49</span>
<span style="margin-top: 10px; font-size: 15px; color: #CFC8E0">sobota, 10 października</span>
<div style="margin-top: 30px; animation: {{shakeAnim}}">
<label class="pwbox" style="width: 340px; height: 52px; box-sizing: border-box; padding: 0 8px 0 8px; border-radius: 26px; background: rgba(255,255,255,0.07); box-shadow: {{ring}}; display: flex; align-items: center; gap: 12px; transition: box-shadow 200ms ease">
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 18px; background: {{accent}}; color: #121118; display: flex; align-items: center; justify-content: center; font-weight: 600; flex-shrink: 0">M</span>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Hasło</span>
<input class="pw" type="password" placeholder="Hasło" value="{{pw}}" onChange="{{onPw}}" onKeyDown="{{onKey}}" style="flex: 1; min-width: 0; height: 40px">
<button aria-label="Odblokuj" onClick="{{submit}}" style="width: 36px; height: 36px; border-radius: 18px; background: #ECEAF2; color: #121118; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</label>
</div>
<span role="status" style="margin-top: 12px; font-size: 13px; color: {{msgColor}}; height: 18px">{{msg}}</span>
<div style="margin-top: auto; display: flex; gap: 18px; font-size: 12px; color: #CFC8E0">
<span style="display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="17" height="10" rx="2.5"></rect><path d="M22 11v2"></path></svg>78%</span>
<span style="display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 8.8a15 15 0 0 1 20 0"></path><path d="M5 12.5a11 11 0 0 1 14 0"></path><path d="M8.5 16.1a6 6 0 0 1 7 0"></path></svg>Dom‑5G</span>
<span style="display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path></svg>2 powiadomienia</span>
</div>
</div>
</section>

<div style="position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%); width: 380px; height: 56px; box-sizing: border-box; padding: 0 10px; display: flex; align-items: center; gap: 12px; border-radius: 28px; background: rgba(16,14,26,0.55); backdrop-filter: blur(24px); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); opacity: {{extrasOp}}; transition: opacity 300ms ease {{extrasDelay}}ms; pointer-events: {{lockPe}}">
<span style="width: 36px; height: 36px; border-radius: 10px; background: #4C3660; flex-shrink: 0"></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 13px; font-weight: 500">[Tytuł utworu]</span><span style="font-size: 12px; color: #A29DB3">[Wykonawca]</span></span>
<button aria-label="Pauza" style="width: 36px; height: 36px; border-radius: 18px; background: #ECEAF2; color: #0B0B10; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5v14M15 5v14"></path></svg></button>
<button aria-label="Następny" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 4 10 8-10 8V4z"></path><path d="M19 5v14"></path></svg></button>
</div>

<div style="position: absolute; right: 32px; bottom: 32px; display: flex; gap: 10px; opacity: {{extrasOp}}; transition: opacity 300ms ease {{extrasDelay}}ms; pointer-events: {{lockPe}}">
<button aria-label="Uśpij" style="width: 48px; height: 48px; border-radius: 24px; background: rgba(16,14,26,0.55); backdrop-filter: blur(24px); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></button>
<button aria-label="Wyłącz" style="width: 48px; height: 48px; border-radius: 24px; background: rgba(16,14,26,0.55); backdrop-filter: blur(24px); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 2v10"></path><path d="M18.4 6.6a9 9 0 1 1-12.8 0"></path></svg></button>
</div>

<div style="position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; opacity: {{deskOp}}; transition: opacity 300ms ease {{deskDelay}}ms; pointer-events: {{deskPe}}">
<span style="font-size: 12px; color: #E4DEF0">Pulpit po odblokowaniu: wyspa wróciła na krawędź.</span>
<button onClick="{{lock}}" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 18px; border-radius: 20px; background: rgba(11,11,16,0.75); backdrop-filter: blur(16px); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1); font-size: 13px">Zablokuj ekran <span style="font-family: 'Geist Mono', monospace; font-size: 10px; opacity: 0.7">⊞ L</span></button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B9A7F5","options":["#B9A7F5","#F1D6AE","#8FD3C1","#F2A7B8"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { locked: true, pw: '', err: false, shake: 0 };
}
submit() {
if (this.state.pw === 'niri') {
this.setState({ locked: false, pw: '', err: false });
} else {
this.setState({ err: true, pw: '', shake: this.state.shake + 1 });
}
}
renderVals() {
const locked = this.state.locked;
const ease = 'cubic-bezier(0.32, 0.72, 0, 1)';
const d = 640;
const enter = (base) => 'opacity 260ms cubic-bezier(0.2,0,0,1) ' + base + 'ms, transform 380ms cubic-bezier(0.2,0,0,1) ' + (base - 40) + 'ms, filter 260ms ease ' + base + 'ms';
const exit = 'opacity 140ms ease, transform 180ms ease, filter 140ms ease';
return {
accent: this.props.accent ?? '#B9A7F5',
islandLabel: locked ? 'Ekran blokady' : 'Wyspa',
top: locked ? 210 : 0,
w: locked ? 460 : 200,
h: locked ? 360 : 36,
rad: locked ? '36px 36px 36px 36px' : '0px 0px 18px 18px',
islandTr: 'top ' + d + 'ms ' + ease + ', width ' + d + 'ms ' + ease + ', height ' + d + 'ms ' + ease + ', border-radius ' + d + 'ms ' + ease,
wpFilter: locked ? 'blur(22px) saturate(1.2) brightness(0.78)' : 'blur(0px) saturate(1) brightness(1)',
wpScale: locked ? 'scale(1.08)' : 'scale(1)',
lockOp: locked ? 1 : 0,
lockSc: locked ? 1 : 0.92,
lockBlur: locked ? 'blur(0px)' : 'blur(8px)',
lockTr: locked ? enter(260) : exit,
lockPe: locked ? 'auto' : 'none',
restOp: locked ? 0 : 1,
restSc: locked ? 0.9 : 1,
restTr: locked ? exit : enter(380),
restPe: locked ? 'none' : 'auto',
earOp: locked ? 0 : 1,
earDelay: locked ? 0 : 420,
deskOp: locked ? 0 : 1,
deskTf: locked ? 'scale(0.97)' : 'scale(1)',
deskDelay: locked ? 0 : 240,
deskPe: locked ? 'none' : 'auto',
extrasOp: locked ? 1 : 0,
extrasDelay: locked ? 520 : 0,
pw: this.state.pw,
onPw: (e) => this.setState({ pw: e.target.value, err: false }),
onKey: (e) => { if (e.key === 'Enter') this.submit(); },
submit: () => this.submit(),
lock: () => this.setState({ locked: true, pw: '', err: false }),
ring: this.state.err ? 'inset 0 0 0 1.5px #F2A7B8' : 'inset 0 0 0 1px rgba(255,255,255,0.12)',
shakeAnim: this.state.shake === 0 ? 'none' : ((this.state.shake % 2 ? 'shakeA' : 'shakeB') + ' 380ms cubic-bezier(0.36, 0.07, 0.19, 0.97)'),
msg: this.state.err ? 'Niepoprawne hasło — spróbuj ponownie' : 'Hasło w prototypie: niri',
msgColor: this.state.err ? '#F2A7B8' : '#A29DB3'
};
}
}
</script>
</body>
</html>
