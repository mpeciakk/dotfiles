<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; opacity: {{sheenOp}}; transition: opacity 300ms ease; background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.02) 45%, rgba(255,255,255,0) 100%); box-shadow: inset 0 -1px 0 rgba(255,255,255,0.22), inset 0 0 0 1px rgba(255,255,255,0.10), inset 0 0 30px rgba(255,255,255,0.06)"></div>
</section>

<div style="position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 12px">
<span style="font-size: 12px; color: #E4DEF0">{{hint}}</span>
<nav aria-label="Stany wyspy" style="display: flex; gap: 4px; padding: 6px; border-radius: 24px; background: rgba(11,11,16,0.7); backdrop-filter: blur(16px); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08)">
<sc-for list="{{items}}" as="it" hint-placeholder-count="6">
<button onClick="{{it.go}}" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 18px; font-size: 13px; background: {{it.bg}}; color: {{it.fg}}; transition: background 200ms ease, color 200ms ease">{{it.label}}<span style="font-family: 'Geist Mono', monospace; font-size: 10px; opacity: 0.7">{{it.key}}</span></button>
</sc-for>
</nav>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent": {"editor": "color", "default": "#B9A7F5", "options": ["#B9A7F5", "#F1D6AE", "#8FD3C1", "#F2A7B8"]}, "material": {"editor": "enum", "options": ["solid", "glass"], "default": "glass"}, "motion": {"editor": "enum", "options": ["płynny", "sprężysty", "zwolniony ×3"], "default": "płynny"}, "anchor": {"editor": "enum", "options": ["wtopiona", "pływająca", "chowana"], "default": "wtopiona"}, "windows": {"editor": "boolean", "default": true}, "glassLevel": {"editor": "enum", "options": ["subtelne", "mocne", "ciekłe"], "default": "ciekłe"}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { mode: 'rest', vol: 40, bar: '100%', barTr: 'none' };
this.timers = [];
}
componentWillUnmount() { this.clear(); clearTimeout(this.leaveT); }
clear() { this.timers.forEach((t) => clearTimeout(t)); this.timers = []; }
k() { return (this.props.motion ?? 'płynny') === 'zwolniony ×3' ? 3 : 1; }
go(m) {
this.clear();
const k = this.k();
if (m === 'notif') {
this.setState({ mode: 'notif', bar: '100%', barTr: 'none' });
this.timers.push(setTimeout(() => this.setState({ bar: '0%', barTr: 'width ' + (3400 * k) + 'ms linear' }), 60));
this.timers.push(setTimeout(() => this.setState({ mode: 'rest' }), 3600 * k));
} else if (m === 'volume') {
const v = this.state.mode === 'volume' ? (this.state.vol >= 100 ? 10 : this.state.vol + 10) : this.state.vol;
this.setState({ mode: 'volume', vol: v });
this.timers.push(setTimeout(() => this.setState({ mode: 'rest' }), 1600 * k));
} else {
this.setState({ mode: m });
}
}
renderVals() {
const SIZES = { rest: [200, 36, 18], volume: [300, 44, 22], media: [380, 56, 28], notif: [420, 76, 30], control: [520, 440, 30], launcher: [680, 356, 30] };
const k = this.k();
const spring = (this.props.motion ?? 'płynny') === 'sprężysty';
const ease = spring ? 'cubic-bezier(0.34, 1.3, 0.5, 1)' : 'cubic-bezier(0.32, 0.72, 0, 1)';
const dur = 460 * k;
SIZES.line = [56, 5, 3];
const anchor = this.props.anchor ?? 'wtopiona';
const hiding = anchor === 'chowana';
const mode = this.state.mode;
const eff = (hiding && mode === 'rest' && !this.state.hover) ? 'line' : mode;
const s = SIZES[eff];
const accent = this.props.accent ?? '#B9A7F5';
const glass = (this.props.material ?? 'glass') === 'glass';
const GL = {
'subtelne': { bg: 'rgba(16,14,26,0.62)', bdf: 'blur(24px) saturate(1.5)', tile: '#17161F', sel: '#1E1D28', chip: '#2C2A39', sheen: 0 },
'mocne': { bg: 'rgba(16,14,26,0.40)', bdf: 'blur(36px) saturate(1.8)', tile: 'rgba(255,255,255,0.06)', sel: 'rgba(255,255,255,0.10)', chip: 'rgba(255,255,255,0.12)', sheen: 0.5 },
'ciekłe': { bg: 'rgba(22,18,36,0.28)', bdf: 'blur(44px) saturate(2) brightness(1.05)', tile: 'rgba(255,255,255,0.07)', sel: 'rgba(255,255,255,0.12)', chip: 'rgba(255,255,255,0.14)', sheen: 1 }
};
const G = GL[this.props.glassLevel ?? 'ciekłe'] || GL['ciekłe'];
const attached = (this.props.anchor ?? 'wtopiona') !== 'pływająca';
const layer = (m) => {
const on = m === eff;
return {
op: on ? 1 : 0,
tf: on ? 'translateX(-50%) scale(1)' : 'translateX(-50%) scale(0.94)',
blur: on ? 'blur(0px)' : 'blur(6px)',
tr: on
? 'opacity ' + (220 * k) + 'ms cubic-bezier(0.2,0,0,1) ' + (160 * k) + 'ms, transform ' + (320 * k) + 'ms cubic-bezier(0.2,0,0,1) ' + (120 * k) + 'ms, filter ' + (220 * k) + 'ms ease ' + (160 * k) + 'ms'
: 'opacity ' + (120 * k) + 'ms ease, transform ' + (160 * k) + 'ms ease, filter ' + (120 * k) + 'ms ease',
pe: on ? 'auto' : 'none'
};
};
const L = {};
Object.keys(SIZES).forEach((m) => { L[m] = layer(m); });
const defs = [
['rest', 'Spoczynek', ''], ['launcher', 'Launcher', '⊞ Spc'], ['control', 'Panel', '⊞ A'],
['notif', 'Powiadomienie', ''], ['volume', 'Głośność', 'vol+'], ['media', 'Media', '⊞ M']
];
const items = defs.map(([id, label, key]) => ({
label, key,
bg: id === mode ? '#ECEAF2' : 'transparent',
fg: id === mode ? '#0B0B10' : '#ECEAF2',
go: () => this.go(id)
}));
return {
accent, L, items,
w: s[0], h: s[1], r: s[2],
islandTr: 'width ' + dur + 'ms ' + ease + ', height ' + dur + 'ms ' + ease + ', border-radius ' + dur + 'ms ' + ease + ', top ' + dur + 'ms ' + ease + ', background ' + (200 * k) + 'ms ease',
top: attached ? 0 : 12,
rad: attached ? '0 0 ' + s[2] + 'px ' + s[2] + 'px' : s[2] + 'px',
earL: 720 - s[0] / 2 - 16,
earR: 720 + s[0] / 2,
earOp: attached && eff !== 'line' ? 1 : 0,
hitH: hiding ? 28 : 0,
hEnter: () => { clearTimeout(this.leaveT); if (!this.state.hover) this.setState({ hover: true }); },
hLeave: () => { clearTimeout(this.leaveT); this.leaveT = setTimeout(() => this.setState({ hover: false }), 250); },
hint: hiding ? 'Najedź kursorem na górną krawędź, żeby wysunąć wyspę. Okna mają pełną wysokość.' : 'Prototyp — wywołaj stan. W shellu robią to skróty i zdarzenia systemowe.',
earTr: 'left ' + dur + 'ms ' + ease + ', opacity ' + (160 * k) + 'ms ease',
dur,
showWindows: this.props.windows ?? true,
winTop: hiding ? 8 : attached ? 44 : 56,
bg: eff === 'line' ? 'rgba(236,234,242,0.75)' : glass ? G.bg : '#0B0B10',
tile: glass ? G.tile : '#17161F', sel: glass ? G.sel : '#1E1D28', chip: glass ? G.chip : '#2C2A39', sheenOp: glass ? G.sheen : 0,
bdf: glass ? G.bdf : 'none',
scrimPe: mode === 'rest' ? 'none' : 'auto',
toRest: () => this.go('rest'),
toControl: () => this.go('control'),
vol: this.state.vol,
volPct: this.state.vol + '%',
bar: this.state.bar,
barTr: this.state.barTr
};
}
}
</script>
</body>
</html>
