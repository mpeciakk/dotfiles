devices: ({
  name: "MX Master 3S";

  smartshift: { on: true; threshold: -1; };
  hiresscroll: { hires: false; invert: false; target: false; };
  dpi: 1500;

  buttons: (
    { cid: 0x56; action = { type: "Keypress"; keys: ["KEY_FORWARD"]; }; },
    { cid: 0x53; action = { type: "Keypress"; keys: ["KEY_BACK"];    }; },
    {
      // Kciuk: klik = overview, trzymanie + ruch = nawigacja niri (bindings.kdl).
      cid: 0xc3;
      action = {
        type: "Gestures";
        gestures: (
          { direction: "None";  mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_O"];        }; },
          { direction: "Left";  mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_RIGHT"];     }; },
          { direction: "Right"; mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_LEFT"];    }; },
          { direction: "Up";    mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_PAGEDOWN"];   }; },
          { direction: "Down";  mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_PAGEUP"]; }; }
        );
      };
    }
  );
});
