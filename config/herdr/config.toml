onboarding = false

[ui.toast]
delivery = "system"

[theme]
name = "terminal"
auto_switch = false

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true
status_indicators = "symbols"
prompt_new_tab_name = false

# Prefix to Caps Lock: keyd (config/keyd/default.conf) emits ctrl+alt+space for it.
# Caps, release, then one key. ctrl+b stays free for Claude Code (background task).
[keys]
prefix = "ctrl+alt+space"
switch_workspace = "prefix+1..9"
switch_tab = ""
next_tab = "prefix+tab"
previous_tab = "prefix+shift+tab"
cycle_pane_next = ""
cycle_pane_previous = ""
new_tab = "prefix+n"
close_tab = "prefix+q"
detach = "prefix+shift+q"
open_notification_target = "prefix+a"
goto = "prefix+slash"
edit_scrollback = "prefix+shift+e"
settings = "prefix+comma"

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "prefix+s"
type = "popup"
command = "herdr-ssh"
description = "ssh: shell, docker, files"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "herdr-here lazygit"
description = "lazygit"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+e"
type = "popup"
command = "herdr-here spf"
description = "superfile"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+d"
type = "popup"
command = "lazydocker"
description = "lazydocker (local)"
width = "90%"
height = "90%"
